services:
  counter:
    build: ./viewCounter
    environment:
      - PORT=4000
    volumes:
      - ./viewCounter/counters.json:/app/counters.json
    ports:
      - "4000:4000"
    depends_on:
      - mongo
    command: npx nodemon --legacy-watch --watch /app --ext js,json counter.js

  books_server:
    build: ./books_server
    environment:
      - DB_URI=mongodb://root:root@mongo:27017/
      - COUNTER_API=http://counter:4000
      - CLIENT_HOST=http://host.docker.internal:3001
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - counter
      - mongo
    command: node dist/index.js

  books_client:
    image: nginx:stable-alpine
    ports:
      - "3001:80"
    volumes:
      - ./books_client/dist:/usr/share/nginx/html:ro
      - ./books_client/default.conf:/etc/nginx/conf.d/default.conf:ro

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: mongoexpressuser
      ME_CONFIG_BASICAUTH_PASSWORD: mongoexpresspass
